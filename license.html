  function apply(lang){
    var x = t[lang] || t.en;
    document.documentElement.lang = lang;
    document.title = x.title;
    document.querySelector('meta[name="description"]').setAttribute('content', x.desc);
    document.querySelector('.hdr .eyebrow').textContent = x.eyebrow;
    document.querySelector('.hdr h1').innerHTML = x.h1;
    document.querySelector('.hdr .meta').textContent = x.meta;
    document.querySelector('.nav-back').lastChild.textContent = x.back;
    document.getElementById('license-body').innerHTML = x.body;
    var footerLinks = document.querySelectorAll('.foot-inner a');
    if (footerLinks[0]) footerLinks[0].textContent = x.footer[0];
    if (footerLinks[1]) footerLinks[1].textContent = x.footer[1];
    if (footerLinks[2]) footerLinks[2].textContent = x.footer[2];
    document.querySelectorAll('[data-lang]').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    localStorage.setItem('comprobare-lang', lang);
  }

  document.querySelectorAll('[data-lang]').forEach(function(btn){
    btn.addEventListener('click', function(){ apply(btn.getAttribute('data-lang')); });
  });
  apply(localStorage.getItem('comprobare-lang') || 'en');
})();
</script>
