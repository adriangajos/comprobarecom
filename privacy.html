<style>

    letter-spacing: 1.5px;

    color: var(--white);

  article ul { margin: 8px 0 18px 22px; }
  article ul li { color: var(--neutral-300); font-size: 15px; padding: 4px 0; }
  article strong { color: var(--white); font-weight: 500; }
  article .callout {
    background: var(--neutral-800);
    border-left: 2px solid var(--blue-primary);
    padding: 16px 22px;
    margin: 20px 0;
    font-size: 14.5px; color: var(--neutral-200);
    border-radius: 0 8px 8px 0;
  }
  article .mono { font-family: var(--font-mono); font-size: 13px; color: var(--blue-light); }

  footer {
    background: var(--neutral-900);
    border-top: 1px solid #1e2023;
    padding: 32px 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--neutral-500);

  .foot-inner {
    max-width: 1240px; margin: 0 auto; padding: 0 32px;

  .foot-inner a { color: var(--neutral-400); }

        <p>If we make material changes to this policy, we will update the date at the top and, where appropriate, notify license holders by email. Continued use of the application after changes constitutes acceptance.</p>
        <h2>11. Contact</h2>
        <p>
          General &amp; privacy: <a href="mailto:gs@plaszowska25.pl">gs@plaszowska25.pl</a><br/>
          Technical support: <a href="mailto:gs@plaszowska25.pl">gs@plaszowska25.pl</a>
        </p>
      `,

    pl: {

      back: 'Powrót do strony głównej',
      body: `

        <p>GS SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ, ul. Płaszowska 25/1, 30-713 Kraków, KRS 0001144358, NIP 6793317716, REGON 540426181. W sprawach związanych z prywatnością lub danymi napisz na <a href="tel:+48606838358">+48 606 838358</a> lub <a href="mailto:gs@plaszowska25.pl">gs@plaszowska25.pl</a>.</p>

        <p>Rysunki (DXF, PDF, zeskanowane plany), pomiary, grupy, pliki projektów (<span class="mono">.cpb</span>), ustawienia aplikacji i preferencje języka są przechowywane lokalnie na Twoim urządzeniu. Nie są do nas przesyłane.</p>

          <li><strong>Weryfikacja klucza licencyjnego</strong> — podczas aktywacji lub odnowienia licencji Twój klucz oraz nieosobowy identyfikator sprzętu są wysyłane do naszego serwera licencyjnego, aby potwierdzić poprawność licencji dla danego stanowiska.</li>

        <p>Zakupy licencji są obsługiwane przez <strong>PayU</strong>, zewnętrznego operatora płatności. Podczas płatności podajesz dane bezpośrednio do PayU; my otrzymujemy wyłącznie potwierdzenie oraz dane potrzebne do wystawienia faktury (imię i nazwisko, nazwa firmy, adres rozliczeniowy, numer VAT, e-mail). Nigdy nie widzimy ani nie przechowujemy danych karty.</p>
        <p>Własna polityka prywatności PayU jest dostępna na ich stronie.</p>

        <ul>
          <li>Aby dostarczyć aplikację i aktualizacje objęte licencją.</li>
          <li>Aby sprawdzić, czy licencje są używane na liczbie stanowisk, dla których zostały kupione.</li>
          <li>Aby wystawiać faktury i spełniać obowiązki podatkowo-księgowe.</li>
          <li>Aby odpowiadać na zgłoszenia wysłane na <a href="mailto:gs@plaszowska25.pl">gs@plaszowska25.pl</a>.</li>
        </ul>
        <h2>6. Jak długo je przechowujemy</h2>
        <p>Rekordy licencji przechowujemy tak długo, jak licencja jest aktywna, oraz przez okres wymagany przepisami księgowymi po jej zakończeniu (zwykle 5 lat w UE). Wiadomości do wsparcia przechowujemy do 24 miesięcy. Logi sprawdzania aktualizacji i analityki są anonimizowane i przechowywane nie dłużej niż 12 miesięcy.</p>
        <h2>7. Twoje prawa</h2>
        <p>Na podstawie RODO i obowiązujących przepisów masz prawo dostępu, poprawiania, eksportu lub usunięcia danych osobowych, które posiadamy, oraz prawo sprzeciwu wobec ich przetwarzania. Aby skorzystać z tych praw, napisz na <a href="mailto:gs@plaszowska25.pl">gs@plaszowska25.pl</a>. Odpowiemy w ciągu 30 dni.</p>
        <h2>8. Udostępnianie podmiotom trzecim</h2>
        <p>Udostępniamy dane wyłącznie dostawcom niezbędnym do działania usługi: PayU (płatności), dostawcy hostingu (strona i instalator) oraz dostawcy serwera aktualizacji / licencji. Nie sprzedajemy danych osobowych i nie udostępniamy ich do celów reklamowych.</p>

        <p>Serwery licencji i aktualizacji są dostępne przez HTTPS. Klucze licencyjne są przechowywane w formie hashowanej. Stosujemy standardowe praktyki ochrony infrastruktury, ale żaden system nie jest w pełni bezpieczny — prosimy o zgłaszanie podejrzanych luk na <a href="mailto:gs@plaszowska25.pl">gs@plaszowska25.pl</a>.</p>

        <h2>11. Kontakt</h2>

      `,
      footer: ['Strona główna', 'Regulamin', 'gs@plaszowska25.pl']
    }
  };

  function apply(lang){
    var x = t[lang] || t.en;
    document.documentElement.lang = lang;
    document.title = x.title;
    document.querySelector('meta[name="description"]').setAttribute('content', x.desc);
    document.querySelector('.hdr .eyebrow').textContent = x.eyebrow;
    document.querySelector('.hdr h1').innerHTML = x.h1;
    document.querySelector('.hdr .meta').textContent = x.meta;
    document.querySelector('.nav-back').lastChild.textContent = x.back;
    document.getElementById('privacy-body').innerHTML = x.body;
    var footerLinks = document.querySelectorAll('.foot-inner a');
    if (footerLinks[0]) footerLinks[0].textContent = x.footer[0];
    if (footerLinks[1]) footerLinks[1].textContent = x.footer[1];
    if (footerLinks[2]) footerLinks[2].textContent = x.footer[2];
    document.querySelectorAll('[data-lang]').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    localStorage.setItem('comprobare-lang', lang);
  }

  document.querySelectorAll('[data-lang]').forEach(function(btn){
    btn.addEventListener('click', function(){ apply(btn.getAttribute('data-lang')); });
  });
  apply(localStorage.getItem('comprobare-lang') || 'en');
})();
