<script>
(function(){
  var content = {

      title: 'Purchase Terms - comprobare',
      desc: 'Purchase terms for Comprobare licenses, including seller details, payment, license delivery, returns, and complaints.',
      eyebrow: 'Purchase',
      h1: 'Purchase <b>Terms</b>',
      meta: 'Effective date: 06 May 2026',
      back: 'Back to pricing',
      body: `
        <p>These purchase terms describe the basic commercial conditions for buying a Comprobare license through comprobare.com.</p>
        <div class="callout"><strong>In short:</strong> Comprobare is sold as a digital yearly license. Payment is handled by PayU, and license access is delivered digitally after payment confirmation.</div>

        <p>The product is a digital license for the Comprobare desktop application. The standard license covers one workstation for one year, unless a separate written agreement states otherwise.</p>

        <p>Consumer withdrawal rights apply where required by applicable law. Because Comprobare includes a 7-day full-featured trial before purchase, activated digital licenses are non-refundable unless mandatory law states otherwise or a technical issue prevents use and cannot be resolved.</p>
        <h2>6. Complaints</h2>
        <p>Complaints and technical issues should be sent to <a href="mailto:comprobareapp@gmail.com">comprobareapp@gmail.com</a>. Please include your order date, license email, operating system, and a short description of the issue.</p>
        <h2>7. Related documents</h2>
        <p>Use of the software is also governed by the <a href="license.html">License Agreement</a>. Personal data handling is described in the <a href="privacy.html">Privacy Policy</a>.</p>
      `,
      footer: ['Home', 'License', 'Privacy', 'comprobareapp@gmail.com']
    },
    pl: {
      title: 'Warunki zakupu - comprobare',
      desc: 'Warunki zakupu licencji Comprobare, w tym dane sprzedawcy, płatność, dostarczenie licencji, zwroty i reklamacje.',
      eyebrow: 'Zakup',
      h1: 'Warunki <b>zakupu</b>',
      meta: 'Data wejścia w życie: 06 May 2026',
      back: 'Powrót do cennika',
      body: `
        <p>Niniejsze warunki opisują podstawowe zasady handlowe zakupu licencji Comprobare przez stronę comprobare.com.</p>
        <div class="callout"><strong>W skrócie:</strong> Comprobare jest sprzedawane jako cyfrowa licencja roczna. Płatność obsługuje PayU, a dostęp do licencji jest dostarczany cyfrowo po potwierdzeniu płatności.</div>
        <h2>1. Sprzedawca</h2>
        <p><strong>GS SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ</strong><br>ul. Płaszowska 25/1, 30-713 Kraków<br>KRS 0001144358 · NIP 6793317716 · REGON 540426181</p>
        <p>Kontakt: <a href="mailto:comprobareapp@gmail.com">comprobareapp@gmail.com</a></p>
        <h2>2. Produkt</h2>
        <p>Produktem jest cyfrowa licencja na aplikację desktopową Comprobare. Standardowa licencja obejmuje jedno stanowisko przez jeden rok, chyba że odrębne pisemne ustalenia stanowią inaczej.</p>
        <h2>3. Cena i płatność</h2>
        <p>Standardowa cena licencji widoczna na stronie wynosi €100 rocznie za stanowisko. Płatności są obsługiwane bezpiecznie przez PayU. Dostępne metody płatności mogą obejmować kartę, BLIK i przelew bankowy, zależnie od dostępności po stronie PayU.</p>
        <h2>4. Dostarczenie licencji</h2>
        <ul>
          <li>Licencja jest dostarczana cyfrowo po potwierdzeniu płatności.</li>
          <li>Standardowy czas aktywacji wynosi do 1 dnia roboczego.</li>
          <li>Fakturę firmową lub zamówienia zbiorcze można ustalić, kontaktując się z nami przed zakupem.</li>
        </ul>
        <h2>5. Zwroty i odstąpienie</h2>
        <p>Prawo odstąpienia konsumenta obowiązuje w zakresie wymaganym przez właściwe przepisy. Ponieważ Comprobare oferuje 7-dniowy trial z pełną funkcjonalnością przed zakupem, aktywowane licencje cyfrowe są bezzwrotne, chyba że bezwzględnie obowiązujące przepisy stanowią inaczej albo problem techniczny uniemożliwia korzystanie z programu i nie może zostać rozwiązany.</p>
        <h2>6. Reklamacje</h2>
        <p>Reklamacje i problemy techniczne należy wysyłać na <a href="mailto:comprobareapp@gmail.com">comprobareapp@gmail.com</a>. Prosimy podać datę zamówienia, e-mail licencyjny, system operacyjny i krótki opis problemu.</p>
        <h2>7. Powiązane dokumenty</h2>
        <p>Korzystanie z programu reguluje również <a href="license.html">Regulamin licencji</a>. Zasady przetwarzania danych osobowych opisuje <a href="privacy.html">Polityka prywatności</a>.</p>
      `,
      footer: ['Strona główna', 'Regulamin', 'Polityka prywatności', 'comprobareapp@gmail.com']
    }
  };

  function apply(lang) {
    var t = content[lang] || content.en;
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelector('meta[name="description"]').setAttribute('content', t.desc);
    document.querySelector('.hdr .eyebrow').textContent = t.eyebrow;
    document.querySelector('.hdr h1').innerHTML = t.h1;
    document.querySelector('.hdr .meta').textContent = t.meta;
    document.querySelector('.nav-back').lastChild.textContent = t.back;
    document.getElementById('terms-body').innerHTML = t.body;
    document.querySelectorAll('.foot-inner a').forEach(function(a, i){ if (t.footer[i]) a.textContent = t.footer[i]; });
    document.querySelectorAll('[data-lang]').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    localStorage.setItem('comprobare-lang', lang);
  }

  document.querySelectorAll('[data-lang]').forEach(function(btn){
    btn.addEventListener('click', function(){ apply(btn.getAttribute('data-lang')); });
  });
  apply(localStorage.getItem('comprobare-lang') || 'en');
})();

<!-- Cookie consent -->
<div id="cookie-notice" role="dialog" aria-label="Cookie consent" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;display:none;background:#16181b;border-top:1px solid #2a2d31;box-shadow:0 -4px 24px rgba(0,0,0,.35);font-family:'DM Sans','Segoe UI',Arial,sans-serif">

      <button id="cookie-reject" type="button" style="font-family:inherit;font-size:13.5px;font-weight:500;color:#d4d8dd;background:transparent;border:1px solid #2e3135;border-radius:8px;padding:9px 16px;cursor:pointer;white-space:nowrap"></button>
      <button id="cookie-accept" type="button" style="font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;background:#0078d4;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;white-space:nowrap"></button>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='comprobare-cookie-consent';
  function applyConsent(v){
    window.comprobareConsent=v;
    // Non-essential cookies (e.g. analytics) must load ONLY when v==='accepted'.
    // TODO: when adding analytics, gate its loader here: if(v==='accepted'){ loadAnalytics(); }
  }
  var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){ applyConsent(saved); return; }
  var lang='en';
  try { var l=localStorage.getItem('comprobare-lang'); if(l){lang=l;} else if(navigator.language&&navigator.language.toLowerCase().indexOf('pl')===0){lang='pl';} } catch(e){}
  var T={
    en:{text:'We use cookies — essential ones to run the site and, with your consent, analytics cookies to measure traffic and improve it.',link:'Privacy policy',accept:'Accept all',reject:'Reject non-essential'},
    pl:{text:'Używamy plików cookie — niezbędnych do działania serwisu oraz, za Twoją zgodą, analitycznych do pomiaru ruchu i ulepszania strony.',link:'Polityka prywatności',accept:'Akceptuję wszystkie',reject:'Tylko niezbędne'}
  };
  var t=T[lang]||T.en, bar=document.getElementById('cookie-notice');
  document.getElementById('cookie-notice-text').textContent=t.text;
  document.getElementById('cookie-notice-link').textContent=t.link;
  var a=document.getElementById('cookie-accept'), r=document.getElementById('cookie-reject');
  a.textContent=t.accept; r.textContent=t.reject;
  bar.style.display='block';
  function choose(v){ try{localStorage.setItem(KEY,v);}catch(e){} applyConsent(v); bar.style.display='none'; }
  a.addEventListener('click',function(){choose('accepted');});
  r.addEventListener('click',function(){choose('rejected');});
})();
</script>
